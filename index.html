		<!-- Simple script to sync font size sliders -->
		<script>
			// Ensure sliders sync with number inputs
			function setupSliderSync() {
				let fontSizeUpdateInProgress = false;
				let qrTextSizeUpdateInProgress = false;
				
				// Text tab font size
				const fontSizeInput = document.getElementById('inputFontSize');
				const fontSizeSlider = document.getElementById('inputFontSizeSlider');
				
				if (fontSizeSlider && fontSizeInput) {
					fontSizeSlider.addEventListener('input', (e) => {
						if (fontSizeUpdateInProgress) return;
						fontSizeUpdateInProgress = true;
						fontSizeInput.value = fontSizeSlider.value;
						fontSizeInput.dispatchEvent(new Event('input', { bubbles: true }));
						fontSizeUpdateInProgress = false;
					});
					
					fontSizeInput.addEventListener('input', (e) => {
						if (fontSizeUpdateInProgress) return;
						fontSizeUpdateInProgress = true;
						fontSizeSlider.value = fontSizeInput.value;
						fontSizeUpdateInProgress = false;
					});
				}
				
				// QR Text font size
				const qrTextSizeInput = document.getElementById('inputQRTextSize');
				const qrTextSizeSlider = document.getElementById('inputQRTextSizeSlider');
				
				if (qrTextSizeSlider && qrTextSizeInput) {
					qrTextSizeSlider.addEventListener('input', (e) => {
						if (qrTextSizeUpdateInProgress) return;
						qrTextSizeUpdateInProgress = true;
						qrTextSizeInput.value = qrTextSizeSlider.value;
						qrTextSizeInput.dispatchEvent(new Event('input', { bubbles: true }));
						qrTextSizeUpdateInProgress = false;
					});
					
					qrTextSizeInput.addEventListener('input', (e) => {
						if (qrTextSizeUpdateInProgress) return;
						qrTextSizeUpdateInProgress = true;
						qrTextSizeSlider.value = qrTextSizeInput.value;
						qrTextSizeUpdateInProgress = false;
					});
				}
				
				// QR Code layout slider display
				const qrLayoutSlider = document.getElementById('inputQRLayout');
				const qrLayoutValue = document.getElementById('qrLayoutValue');
				
				if (qrLayoutSlider && qrLayoutValue) {
					qrLayoutSlider.addEventListener('input', (e) => {
						qrLayoutValue.textContent = qrLayoutSlider.value;
					});
				}
				
				// Text input - enforce 6 line limit
				const textInput = document.getElementById('inputText');
				if (textInput) {
					textInput.addEventListener('input', (e) => {
						const lines = textInput.value.split('\n');
						if (lines.length > 6) {
							textInput.value = lines.slice(0, 6).join('\n');
						}
					});
				}
			}
			
			// Call when DOM is ready
			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', setupSliderSync);
			} else {
				setupSliderSync();
			}
		</script>

			// Global variables for Bluetooth connection and printing
			let bluetoothDevice = null;
			let bluetoothCharacteristic = null;
			
			// Printer constants (from printer.js)
			const PACKET_SIZE_BYTES = 128;
			const HEADER_DATA = (mmWidth, bytes) =>
				new Uint8Array([
					0x1b,
					0x40,
					0x1d,
					0x76,
					0x30,
					0x00,
					mmWidth % 256,
					Math.floor(mmWidth / 256),
					bytes % 256,
					Math.floor(bytes / 256),
				]);
			const END_DATA = new Uint8Array([0x1b, 0x64, 0x00]);
			
			// Helper function to convert canvas to print data (from printer.js)
			const getWhitePixel = (canvas, imageData, x, y) => {
				const idx = (canvas.width * y + x) * 4;
				const red = imageData[idx];
				const green = imageData[idx + 1];
				const blue = imageData[idx + 2];
				const alpha = imageData[idx + 3];
				if (alpha < 128) return 0;
				// Use luminance to determine if pixel is "light" (background) or "dark" (text)
				// This respects antialiasing better than checking all channels > 240
				const luminance = 0.299 * red + 0.587 * green + 0.114 * blue;
				// Threshold at 200 - pixels lighter than this are background, darker are printed
				return luminance > 200 ? 0 : 1;
			};
			
			const getPrintData = (canvas) => {
				const ctx = canvas.getContext("2d");
				const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
				const data = new Uint8Array((canvas.width / 8) * canvas.height);
				let offset = 0;
				for (let i = 0; i < canvas.height; ++i) {
					for (let k = 0; k < canvas.width / 8; ++k) {
						const k8 = k * 8;
						data[offset++] =
							getWhitePixel(canvas, imageData, k8 + 0, i) * 128 +
							getWhitePixel(canvas, imageData, k8 + 1, i) * 64 +
							getWhitePixel(canvas, imageData, k8 + 2, i) * 32 +
							getWhitePixel(canvas, imageData, k8 + 3, i) * 16 +
							getWhitePixel(canvas, imageData, k8 + 4, i) * 8 +
							getWhitePixel(canvas, imageData, k8 + 5, i) * 4 +
							getWhitePixel(canvas, imageData, k8 + 6, i) * 2 +
							getWhitePixel(canvas, imageData, k8 + 7, i);
					}
				}
				return data;
			};
			
			// Function to send print data (from printer.js)
			const sendPrintData = async (canvas) => {

					await bluetoothCharacteristic.writeValueWithResponse(

					for (let i = 0; i < data.length; i += PACKET_SIZE_BYTES) {
						await bluetoothCharacteristic.writeValueWithResponse(data.slice(i, i + PACKET_SIZE_BYTES));
						console.log(`Sent ${Math.min(i + PACKET_SIZE_BYTES, data.length)}/${data.length} bytes`);
					}
					
					console.log(`Sent ${data.length}/${data.length} bytes (done)`);
					await bluetoothCharacteristic.writeValueWithResponse(END_DATA);
				} catch (err) {
					console.error("Print error:", err);

					// Set up Print button handler
					if (btnPrint && !btnPrint.hasListener) {

								const tabCopiesMap = {
									"#nav-text": "inputCopies",

								const copiesInputId = tabCopiesMap[tabTarget] || "inputCopies";
								const copies = parseInt(document.querySelector("#" + copiesInputId)?.value || 1);
								
								for (let i = 0; i < copies; i++) {
									await sendPrintData(rotatedCanvas);
									if (i < copies - 1) {
										await new Promise(resolve => setTimeout(resolve, 500));

								statusEl.className = "alert alert-success mb-3 d-flex align-items-center justify-content-between";

								// Reset message after 3 seconds

		<script>
			// Placeholder for compatibility - actual rendering handled by konva-renderer.js
			function updateCanvasText() {
				// Trigger re-render with current alignment
				if (window.printPreview && window.printPreview.renderText) {
					const manager = window.printPreview.managers.canvas;
					if (manager) {

					}
				}
			}
			
			// Function to create a rotated canvas for printing (without margins)
			// The printer expects the image rotated 90 degrees clockwise
			// Extracts only the printable area (excluding the margin regions)
			function getRotatedCanvasForPrint() {
				// Get the active tab
				const activeTab = document.querySelector(".nav-link.active");
				const tabTarget = activeTab?.getAttribute("data-bs-target");
				
				// Map tab to canvas manager
				const tabCanvasMap = {
					"#nav-text": "canvas",
					"#nav-barcode": "canvasBarcode",
					"#nav-image": "canvasImage",
					"#nav-qr": "canvasQR",
					"#nav-qr-text": "canvasQRText"
				};
				
				const canvasId = tabCanvasMap[tabTarget] || "canvas";
				
				// Get canvas from Konva manager first (if it's available)
				let displayCanvas = null;
				
				if (window.printPreview && window.printPreview.managers && window.printPreview.managers[canvasId]) {
					const manager = window.printPreview.managers[canvasId];
					if (manager && manager.stage) {
						try {
							// Force complete redraw with cache enabled
							manager.stage.batchDraw();
							
							// Use Konva's toCanvas() to get a properly rendered output
							const stageCanvas = manager.stage.toCanvas();
							if (stageCanvas) {
								displayCanvas = stageCanvas;
								console.log("Extracted stage canvas via toCanvas():", displayCanvas.width, "x", displayCanvas.height);
							}
						} catch(e) {
							console.warn("Failed to use toCanvas():", e);
							
							// Fallback: try composite of layers
							try {
								manager.stage.draw();
								
								const stageWidth = manager.stage.width();
								const stageHeight = manager.stage.height();
								
								const compositeCanvas = document.createElement('canvas');
								compositeCanvas.width = stageWidth;
								compositeCanvas.height = stageHeight;
								const compositeCtx = compositeCanvas.getContext('2d');
								
								// Draw each layer
								const layers = manager.stage.getLayers();
								layers.forEach(layer => {
									const layerCanvas = layer.canvas;
									if (layerCanvas && layerCanvas._canvas) {
										compositeCtx.drawImage(layerCanvas._canvas, 0, 0);
									}
								});
								
								displayCanvas = compositeCanvas;
								console.log("Fallback 1: Composite canvas", displayCanvas.width, "x", displayCanvas.height);
							} catch(e2) {
								console.warn("Fallback 1 failed:", e2);
								
								// Fallback 2: use visible rendered canvas
								try {
									const konvaContainer = manager.stage.container();
									const renderedCanvases = konvaContainer.querySelectorAll('canvas');
									if (renderedCanvases.length > 0) {
										displayCanvas = renderedCanvases[0];
										console.log("Fallback 2: First rendered canvas");
									}
								} catch(e3) {
									console.warn("Fallback 2 failed:", e3);
								}
							}
						}
					}
				}
				
				// Fallback to DOM canvas element
				if (!displayCanvas) {
					displayCanvas = document.querySelector("#" + canvasId);
				}
				
				if (!displayCanvas) {
					console.error("Could not find canvas for printing");
					return null;
				}
				
				console.log("Using canvas dimensions:", displayCanvas.width, "x", displayCanvas.height);
				
				// Get constants and label size from printPreview
				const HORIZONTAL_MARGIN_MM = window.printPreview?.HORIZONTAL_MARGIN_MM || 1;
				const PIXELS_PER_MM = window.printPreview?.PIXELS_PER_MM || 8;
				const DISPLAY_HEIGHT_MM = window.printPreview?.DISPLAY_HEIGHT_MM || 15;
				const labelSize = window.printPreview?.labelSize || { width: 40, height: 12 };
				
				// Calculate margins in pixels
				const marginLeftPx = HORIZONTAL_MARGIN_MM * PIXELS_PER_MM;
				const marginTopPx = (DISPLAY_HEIGHT_MM - labelSize.height) * PIXELS_PER_MM / 2;
				const printableWidth = labelSize.width * PIXELS_PER_MM;
				const printableHeight = labelSize.height * PIXELS_PER_MM;
				
				// Create intermediate canvas with just the printable area
				const croppedCanvas = document.createElement("canvas");
				croppedCanvas.width = printableWidth;
				croppedCanvas.height = printableHeight;
				const croppedCtx = croppedCanvas.getContext("2d");
				croppedCtx.drawImage(
					displayCanvas,
					marginLeftPx, marginTopPx, printableWidth, printableHeight,
					0, 0, printableWidth, printableHeight
				);
				
				// Now rotate the cropped canvas for printing
				const printCanvas = document.createElement("canvas");
				printCanvas.width = croppedCanvas.height;
				printCanvas.height = croppedCanvas.width;
				
				const printCtx = printCanvas.getContext("2d");
				printCtx.translate(printCanvas.width / 2, printCanvas.height / 2);
				printCtx.rotate(Math.PI / 2);
				printCtx.translate(-croppedCanvas.width / 2, -croppedCanvas.height / 2);
				printCtx.drawImage(croppedCanvas, 0, 0);
				
				return printCanvas;
			}

						} else if (formatUpper === "EAN") {
							// EAN can be 13 digits (EAN-13) or 8 digits (EAN-8)
							if (/^\d{13}$/.test(data)) {
								jsbarFormat = "EAN13";
								isValid = true;
							} else if (/^\d{8}$/.test(data)) {
								jsbarFormat = "EAN8";
								isValid = true;
							} else {
								isValid = false;
							}
							barcodeHeightRatio = 0.4;
						} else if (formatUpper === "CODE128") {
							jsbarFormat = "CODE128";
							barcodeHeightRatio = 0.75;
							isValid = true; // CODE128 accepts most inputs
						}
						
						// Show error if data validation failed
						if (!isValid) {
							ctx.fillStyle = "#999";
							ctx.font = "12px sans-serif";
							ctx.textAlign = "center";
							ctx.textBaseline = "alphabetic";
							const errorMsg = formatUpper === "UPC" ? "UPC: 12 digits required" : 
										 formatUpper === "EAN" ? "EAN: 8 or 13 digits required" : "Invalid data";
							ctx.fillText(errorMsg, marginLeftPx + printableWidth / 2, marginTopPx + printableHeight / 2);
							return;
						}
						
						// Create temporary canvas for barcode
						const tempCanvas = document.createElement("canvas");
						const barcodeHeight = printableHeight * barcodeHeightRatio;
						
						// Set reasonable initial dimensions for the temp canvas
						tempCanvas.width = printableWidth;
						tempCanvas.height = barcodeHeight;
						
						try {
							// Generate barcode on temp canvas with the correct format
							window.JsBarcode(tempCanvas, data, {
								format: jsbarFormat,
								width: 2,
								height: barcodeHeight,
								margin: 0
							});
							
							// Calculate optimal scale to fit barcode in available space
							// Use 95% of available width to leave small margins
							const maxWidth = printableWidth * 0.95;
							const scaleX = maxWidth / tempCanvas.width;
							const scaleY = barcodeHeight / tempCanvas.height;
							
							// Use the smaller scale to ensure barcode fits both horizontally and vertically
							const scale = Math.min(scaleX, scaleY);
							
							const scaledWidth = tempCanvas.width * scale;
							const scaledHeight = tempCanvas.height * scale;
							
							// Center barcode in printable area
							const barcodeX = marginLeftPx + (printableWidth - scaledWidth) / 2;
							const barcodeY = marginTopPx + (printableHeight - scaledHeight) / 2;
							
							ctx.drawImage(tempCanvas, barcodeX, barcodeY, scaledWidth, scaledHeight);
						} catch (err) {
							// If barcode generation fails, show error
							ctx.fillStyle = "#999";
							ctx.font = "12px sans-serif";
							ctx.textAlign = "center";
							ctx.textBaseline = "alphabetic";
							ctx.fillText("Invalid barcode", marginLeftPx + printableWidth / 2, marginTopPx + printableHeight / 2);
						}
					}
				}
				
				// ===== IMAGE TAB RENDERING =====
				function updateCanvasImage() {
					const canvas = document.querySelector("#canvasImage");
					const inputImage = document.querySelector("#inputImage");
					
					if (!canvas || !inputImage) return;
					
					const ctx = canvas.getContext("2d");
					
					// Clear canvas
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					
					// Draw background
					ctx.fillStyle = "#e8e8e8";
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					
					// Calculate printable area
					const marginLeftPx = HORIZONTAL_MARGIN_MM * PIXELS_PER_MM;
					const marginTopPx = (DISPLAY_HEIGHT_MM - labelSize.height) * PIXELS_PER_MM / 2;
					const printableWidth = labelSize.width * PIXELS_PER_MM;
					const printableHeight = labelSize.height * PIXELS_PER_MM;
					
					// Draw white printable area
					ctx.fillStyle = "#fff";
					ctx.fillRect(marginLeftPx, marginTopPx, printableWidth, printableHeight);
					
					// Load and draw image
					if (inputImage.files && inputImage.files[0]) {
						const reader = new FileReader();
						reader.onload = (e) => {
							const img = new Image();
							img.onload = () => {
								// Calculate scaling to fit within printable area while maintaining aspect ratio
								const maxWidth = printableWidth;
								const maxHeight = printableHeight;
								let width = img.width;
								let height = img.height;
								const ratio = Math.min(maxWidth / width, maxHeight / height);
								width = width * ratio;
								height = height * ratio;
								
								// Center image in printable area
								const x = marginLeftPx + (printableWidth - width) / 2;
								const y = marginTopPx + (printableHeight - height) / 2;
								
								// Draw image
								ctx.drawImage(img, x, y, width, height);
							};
							img.src = e.target.result;
						};
						reader.readAsDataURL(inputImage.files[0]);
					}
				}
				
				// ===== QR CODE TAB RENDERING =====
				function updateCanvasQR() {
					const canvas = document.querySelector("#canvasQR");
					const inputQR = document.querySelector("#inputQR");
					const inputQRLayout = document.querySelector("#inputQRLayout");
					
					if (!canvas || !inputQR || !inputQRLayout) return;
					
					const data = inputQR.value || "https://example.com";
					const layout = inputQRLayout.value;
					
					const ctx = canvas.getContext("2d");
					
					// Clear canvas
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					
					// Draw background
					ctx.fillStyle = "#e8e8e8";
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					
					// Calculate printable area
					const marginLeftPx = HORIZONTAL_MARGIN_MM * PIXELS_PER_MM;
					const marginTopPx = (DISPLAY_HEIGHT_MM - labelSize.height) * PIXELS_PER_MM / 2;
					const printableWidth = labelSize.width * PIXELS_PER_MM;
					const printableHeight = labelSize.height * PIXELS_PER_MM;
					
					// Draw white printable area
					ctx.fillStyle = "#fff";
					ctx.fillRect(marginLeftPx, marginTopPx, printableWidth, printableHeight);
					
					if (typeof window.QRCode !== 'undefined' && typeof window.QRCode.toCanvas === 'function') {
						try {
							if (layout === "single") {
								// Single QR code centered
								const qrSize = Math.min(printableWidth, printableHeight) * 0.9;
								const qrX = marginLeftPx + (printableWidth - qrSize) / 2;
								const qrY = marginTopPx + (printableHeight - qrSize) / 2;
								
								// Create temporary canvas for QR code
								const tempCanvas = document.createElement("canvas");
								tempCanvas.width = qrSize;
								tempCanvas.height = qrSize;
								
								window.QRCode.toCanvas(tempCanvas, data, { width: qrSize }, (err) => {
									if (!err) {
										ctx.drawImage(tempCanvas, qrX, qrY, qrSize, qrSize);
									}
								});
							} else {
								// Multiple QR codes side by side
								const maxQRSize = Math.min(printableHeight * 0.9, printableWidth / 3);
								const qrCount = Math.floor(printableWidth / maxQRSize);
								
								for (let i = 0; i < qrCount; i++) {
									const qrX = marginLeftPx + i * maxQRSize + (printableWidth - qrCount * maxQRSize) / 2;
									const qrY = marginTopPx + (printableHeight - maxQRSize) / 2;
									
									// Create temporary canvas for each QR code
									const tempCanvas = document.createElement("canvas");
									tempCanvas.width = maxQRSize;
									tempCanvas.height = maxQRSize;
									
									window.QRCode.toCanvas(tempCanvas, data, { width: maxQRSize }, (err) => {
										if (!err) {
											ctx.drawImage(tempCanvas, qrX, qrY, maxQRSize, maxQRSize);
										}
									});
								}
							}
						} catch (err) {
							console.error('QR code error:', err);
						}
					}
				}
				
				// ===== QR CODE + TEXT TAB RENDERING =====
				function updateCanvasQRText() {
					const canvas = document.querySelector("#canvasQRText");
					const inputQRTextData = document.querySelector("#inputQRTextData");
					const inputQRText = document.querySelector("#inputQRText");
					const inputQRTextSize = document.querySelector("#inputQRTextSize");
					
					if (!canvas || !inputQRTextData || !inputQRText || !inputQRTextSize) return;
					
					const qrData = inputQRTextData.value || "https://example.com";
					const textData = inputQRText.value || "example.com";
					const fontSizeMm = parseFloat(inputQRTextSize.value) || 6;
					const fontSize = fontSizeMm * PIXELS_PER_MM;
					
					const ctx = canvas.getContext("2d");
					
					// Clear canvas
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					
					// Draw background
					ctx.fillStyle = "#e8e8e8";
					ctx.fillRect(0, 0, canvas.width, canvas.height);
					
					// Calculate printable area
					const marginLeftPx = HORIZONTAL_MARGIN_MM * PIXELS_PER_MM;
					const marginTopPx = (DISPLAY_HEIGHT_MM - labelSize.height) * PIXELS_PER_MM / 2;
					const printableWidth = labelSize.width * PIXELS_PER_MM;
					const printableHeight = labelSize.height * PIXELS_PER_MM;
					
					// Draw white printable area
					ctx.fillStyle = "#fff";
					ctx.fillRect(marginLeftPx, marginTopPx, printableWidth, printableHeight);
					
					if (typeof window.QRCode !== 'undefined' && typeof window.QRCode.toCanvas === 'function') {
						try {
							// Calculate split: QR on left, text on right
							const qrSize = printableHeight * 0.9;
							const textWidth = printableWidth - qrSize - fontSize * 0.4;
							
							// Draw QR code on left
							const qrX = marginLeftPx + fontSize * 0.2;
							const qrY = marginTopPx + (printableHeight - qrSize) / 2;
							
							// Create temporary canvas for QR code
							const tempCanvas = document.createElement("canvas");
							tempCanvas.width = qrSize;
							tempCanvas.height = qrSize;
							
							window.QRCode.toCanvas(tempCanvas, qrData, { width: qrSize }, (err) => {
								if (!err) {
									// Copy QR code to main canvas
									ctx.drawImage(tempCanvas, qrX, qrY, qrSize, qrSize);
									
									// Draw text on right
									ctx.fillStyle = "#000";
									ctx.font = `${Math.round(fontSize)}px sans-serif`;
									ctx.textAlign = "left";
									ctx.textBaseline = "alphabetic";
									
									const lines = textData.split('\n');
									const lineHeight = fontSize * 1.2;
									const textX = qrX + qrSize + fontSize * 0.2;
									const textCenterY = marginTopPx + printableHeight / 2;
									const totalTextHeight = (lines.length - 1) * lineHeight;
									
									// Clipping for text area
									ctx.save();
									ctx.beginPath();
									ctx.rect(textX, marginTopPx, textWidth, printableHeight);
									ctx.clip();
									
									lines.forEach((line, index) => {
										const y = textCenterY - totalTextHeight / 2 + (index * lineHeight) + fontSize * 0.35;
										ctx.fillText(line, textX, y);
									});
									
									ctx.restore();
								}
							});
						} catch (err) {
							console.error('QR code + text error:', err);
						}
					}
				}
				
				// Initialize other canvas previews
				try { updateCanvasBarcode(); } catch(e) {}
				try { updateCanvasImage(); } catch(e) {}
				try { updateCanvasQR(); } catch(e) {}
				try { updateCanvasQRText(); } catch(e) {}
				
				// Add tab click listeners to trigger rendering when user navigates
				const tabButtons = document.querySelectorAll('[role="tab"]');
				tabButtons.forEach(btn => {
					btn.addEventListener('click', () => {
						// Give tab animation time to complete before rendering
						setTimeout(() => {
							try { updateCanvasBarcode(); } catch(e) {}
							try { updateCanvasImage(); } catch(e) {}
							try { updateCanvasQR(); } catch(e) {}
							try { updateCanvasQRText(); } catch(e) {}
						}, 100);
					});
				});
				
				// ===== BARCODE TAB LISTENERS =====
				const barcodeInput = document.querySelector("#inputBarcode");
				const barcodeTypeInput = document.querySelector("#inputBarcodeType");
				
				if (barcodeInput) barcodeInput.addEventListener("input", updateCanvasBarcode);
				if (barcodeTypeInput) barcodeTypeInput.addEventListener("change", updateCanvasBarcode);
				
				// ===== IMAGE TAB LISTENERS =====
				const inputImage = document.querySelector("#inputImage");
				
				if (inputImage) inputImage.addEventListener("change", updateCanvasImage);
				
				// ===== QR CODE TAB LISTENERS =====
				const inputQR = document.querySelector("#inputQR");
				const inputQRLayout = document.querySelector("#inputQRLayout");
				
				if (inputQR) inputQR.addEventListener("input", updateCanvasQR);
				if (inputQRLayout) inputQRLayout.addEventListener("change", updateCanvasQR);
				
				// ===== QR CODE + TEXT TAB LISTENERS =====
				const inputQRTextData = document.querySelector("#inputQRTextData");
				const inputQRText = document.querySelector("#inputQRText");
				const inputQRTextSize = document.querySelector("#inputQRTextSize");
				const inputQRTextSizeSlider = document.querySelector("#inputQRTextSizeSlider");
				
				if (inputQRTextData) inputQRTextData.addEventListener("input", updateCanvasQRText);
				if (inputQRText) inputQRText.addEventListener("input", () => {
					// Limit to 5 lines maximum
					const lines = inputQRText.value.split('\n');
					if (lines.length > 5) {
						inputQRText.value = lines.slice(0, 5).join('\n');
					}
					updateCanvasQRText();
				});
				if (inputQRTextSize) inputQRTextSize.addEventListener("input", () => {
					// Sync slider with text input
					if (inputQRTextSizeSlider) {
						inputQRTextSizeSlider.value = inputQRTextSize.value;
					}
				});
				if (inputQRTextSizeSlider) inputQRTextSizeSlider.addEventListener("input", () => {
					// Sync text input with slider
					if (inputQRTextSize) {
						inputQRTextSize.value = inputQRTextSizeSlider.value;
					}
				});
				
				// Ensure canvas has no transform applied
				const canvas = document.querySelector("#canvas");
				if (canvas) {
					canvas.style.transform = "none";
				}
			}, 100);
		</script>
		<script>
			if ("serviceWorker" in navigator) {
				navigator.serviceWorker.register("./sw.js");
			}
		</script>
	</body>
